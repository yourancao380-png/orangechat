name: Apply OrangeChat modernization

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepared modernization patch
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/orangechat-modernization.patch
          git apply --binary /tmp/orangechat-modernization.patch
          rm .github/workflows/bootstrap-modernization.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "feat: modernize chat memory transport and MCP"
          git push origin HEAD:codex/orangechat-modernization
          git checkout -B cleanup origin/master
          git rm .github/workflows/bootstrap-modernization.yml
          git commit -m "chore: remove modernization bootstrap"
          git push origin HEAD:master

